<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
   <title>Panel administrativo | Jaguar Reservation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link   href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"   rel="stylesheet">
    <link  href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" >
    <link   rel="stylesheet" href="../css/admin.css" >
    <link   rel="stylesheet"  href="../css/dashboard.css">
</head>
<body>
    <div class="admin-layout">
       <!-- =====================================
             SIDEBAR
        ====================================== -->
       <aside class="sidebar-admin">
           <div class="sidebar-brand">
               <img src="../img/V.E CEUTEC logo-03.png" alt="Jaguares CEUTEC" class="sidebar-logo">
               <div class="sidebar-brand-text">  <h1>Jaguar Reservation</h1> <p>Polideportivo</p></div>
           </div>
           <div class="sidebar-section-title"> Administración</div>
           <nav class="sidebar-menu">
               <a   href="dashboard.html" class="sidebar-link" >
                    <i class="bi bi-house-door"></i>
                    <span>Inicio</span>
                </a>
               <a href="reservaciones.html"class="sidebar-link">
                    <i class="bi bi-calendar2-check"></i>
                    <span>Reservas</span>
                </a>
                 <a href="calendario.html" class="sidebar-link">
                    <i class="bi bi-calendar3"></i>
                    <span>Calendario</span>
                </a>
                 <a   href="estudiantes.html"   class="sidebar-link" >
                    <i class="bi bi-mortarboard"></i>
                    <span>Estudiantes</span>
                </a>
               <a  href="inventario.html" class="sidebar-link">
                    <i class="bi bi-controller"></i>
                    <span>Zona Jaguar</span>
                </a>
               <a href="equipos.html" class="sidebar-link">
                    <i class="bi bi-people"></i>
                    <span>Equipos</span>
                </a>
               <a  href="asistencia.html"  class="sidebar-link">
                    <i class="bi bi-clipboard-check"></i>
                    <span>Asistencia</span>
                </a>
               <a   href="guardias.html"   class="sidebar-link">
                    <i class="bi bi-person-badge"></i>
                    <span>Guardias</span>
                </a>
               <a href="reportes.html"class="sidebar-link active">
                    <i class="bi bi-file-earmark-bar-graph"></i>
                    <span>Reportes</span>
                </a>
           </nav>
           <div class="sidebar-bottom">
               <button
                    type="button"
                    class="btn-cerrar-sidebar"
                    onclick="cerrarSesion()"
                >
                    <i class="bi bi-box-arrow-left"></i>
                    <span>Cerrar sesión</span>
                </button>
           </div>
       </aside>
       <!-- Overlay móvil -->
       <div
            class="sidebar-overlay"
            id="sidebar-overlay"
            onclick="cerrarMenu()"
        ></div>
    
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</html>
